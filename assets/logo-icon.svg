<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="26" fill="url(#iconBg)" stroke="url(#iconRing)" stroke-width="3" />
  
  <!-- DNA Structure -->
  <path d="M 32,25 C 20,40 20,55 50,60 C 80,65 80,80 68,90" fill="none" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round" filter="url(#iconGlow)" />
  <path d="M 68,25 C 80,40 80,55 50,60 C 20,65 20,80 32,90" fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round" filter="url(#iconGlow)" />
  
  <!-- Base Pairs -->
  <line x1="33" y1="36" x2="67" y2="36" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 2" />
  <line x1="31" y1="48" x2="69" y2="48" stroke="#ffffff" stroke-width="2.5" />
  <line x1="31" y1="72" x2="69" y2="72" stroke="#ffffff" stroke-width="2.5" />
  <line x1="33" y1="82" x2="67" y2="82" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3 2" />

  <!-- Center Nucleus Node -->
  <circle cx="50" cy="60" r="6" fill="#34d399" filter="url(#iconGlow)" />
  <circle cx="50" cy="60" r="2.5" fill="#ffffff" />
</svg>
