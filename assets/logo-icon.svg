<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glowing Rim Gradients -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="dnaStrandA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="dnaStrandB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Base Disk -->
  <circle cx="256" cy="256" r="250" fill="url(#spaceGrad)" />

  <!-- Outer Cybernetic Tech Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#rimGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />

  <!-- 360-degree Tech Axis Compass Ticks -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.7">
    <line x1="256" y1="16" x2="256" y2="28" stroke="#00f2fe" stroke-width="2" />
    <line x1="256" y1="484" x2="256" y2="496" stroke="#f43f5e" stroke-width="2" />
    <line x1="16" y1="256" x2="28" y2="256" stroke="#38bdf8" stroke-width="2" />
    <line x1="484" y1="256" x2="496" y2="256" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Rosalind Photo 51 X-Ray Geometric Crosshair / Diffraction Ring -->
  <g opacity="0.25">
    <line x1="110" y1="110" x2="402" y2="402" stroke="url(#rimGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="110" y1="402" x2="402" y2="110" stroke="url(#rimGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="5 7" />
    <circle cx="256" cy="256" r="105" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- De Bruijn Graph Network & Algorithmic Matrix Lattice -->
  <g opacity="0.6">
    <line x1="145" y1="160" x2="210" y2="105" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="210" y1="105" x2="302" y2="105" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="302" y1="105" x2="367" y2="160" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="145" y1="352" x2="210" y2="407" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="210" y1="407" x2="302" y2="407" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="302" y1="407" x2="367" y2="352" stroke="#f43f5e" stroke-width="1.5" />
    <line x1="145" y1="160" x2="145" y2="352" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <line x1="367" y1="160" x2="367" y2="352" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  </g>

  <!-- Hydrogen Bond Base-Pair Rungs -->
  <g stroke-linecap="round">
    <line x1="190" y1="135" x2="322" y2="135" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="5 4" opacity="0.8" />
    <circle cx="190" cy="135" r="5" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="256" cy="135" r="3.5" fill="#ffffff" />
    <circle cx="322" cy="135" r="5" fill="#f43f5e" filter="url(#softGlow)" />

    <line x1="160" y1="185" x2="352" y2="185" stroke="#60a5fa" stroke-width="3.5" stroke-dasharray="6 4" opacity="0.85" />
    <circle cx="160" cy="185" r="6" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="256" cy="185" r="4" fill="#ffffff" />
    <circle cx="352" cy="185" r="6" fill="#ec4899" filter="url(#softGlow)" />

    <line x1="180" y1="230" x2="332" y2="230" stroke="#818cf8" stroke-width="4" opacity="0.9" />
    <circle cx="180" cy="230" r="6.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="256" cy="230" r="4" fill="#ffffff" />
    <circle cx="332" cy="230" r="6.5" fill="#f43f5e" filter="url(#softGlow)" />

    <line x1="225" y1="256" x2="287" y2="256" stroke="#c084fc" stroke-width="3" stroke-dasharray="3 2" />
    
    <line x1="332" y1="282" x2="180" y2="282" stroke="#818cf8" stroke-width="4" opacity="0.9" />
    <circle cx="332" cy="282" r="6.5" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="256" cy="282" r="4" fill="#ffffff" />
    <circle cx="180" cy="282" r="6.5" fill="#f43f5e" filter="url(#softGlow)" />

    <line x1="352" y1="327" x2="160" y2="327" stroke="#60a5fa" stroke-width="3.5" stroke-dasharray="6 4" opacity="0.85" />
    <circle cx="352" cy="327" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="256" cy="327" r="4" fill="#ffffff" />
    <circle cx="160" cy="327" r="6" fill="#ec4899" filter="url(#softGlow)" />

    <line x1="322" y1="377" x2="190" y2="377" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="5 4" opacity="0.8" />
    <circle cx="322" cy="377" r="5" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="256" cy="377" r="3.5" fill="#ffffff" />
    <circle cx="190" cy="377" r="5" fill="#f43f5e" filter="url(#softGlow)" />
  </g>

  <!-- Glowing DNA Strand Wave A (Cyan to Royal Blue) -->
  <path d="M 190,135 C 115,185 115,230 256,256 C 397,282 397,327 322,377" 
        fill="none" stroke="url(#dnaStrandA)" stroke-width="10" stroke-linecap="round" filter="url(#intenseGlow)" />
  <path d="M 190,135 C 115,185 115,230 256,256 C 397,282 397,327 322,377" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Glowing DNA Strand Wave B (Ruby Rose to Electric Violet) -->
  <path d="M 322,135 C 397,185 397,230 256,256 C 115,282 115,327 190,377" 
        fill="none" stroke="url(#dnaStrandB)" stroke-width="10" stroke-linecap="round" filter="url(#intenseGlow)" />
  <path d="M 322,135 C 397,185 397,230 256,256 C 115,282 115,327 190,377" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Central Algorithmic Singularity Node -->
  <circle cx="256" cy="256" r="14" fill="#030712" stroke="url(#rimGrad)" stroke-width="3" />
  <circle cx="256" cy="256" r="8" fill="#10b981" filter="url(#intenseGlow)" />
  <circle cx="256" cy="256" r="3.5" fill="#ffffff" />

  <!-- Surrounding Graph Nodes (A, T, C, G bioinformatic vertices) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <circle cx="256" cy="78" r="15" fill="#0b1120" stroke="#00f2fe" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="256" y="78" fill="#00f2fe">A</text>

    <circle cx="434" cy="256" r="15" fill="#0b1120" stroke="#f43f5e" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="434" y="256" fill="#f43f5e">T</text>

    <circle cx="256" cy="434" r="15" fill="#0b1120" stroke="#a855f7" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="256" y="434" fill="#a855f7">C</text>

    <circle cx="78" cy="256" r="15" fill="#0b1120" stroke="#10b981" stroke-width="2.5" filter="url(#softGlow)" />
    <text x="78" y="256" fill="#10b981">G</text>
  </g>
</svg>
