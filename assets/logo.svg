<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 5)">
    <rect width="80" height="80" rx="20" fill="#0b1120" stroke="url(#logoGrad)" stroke-width="2.5" />
    <!-- DNA Curves -->
    <path d="M 25,20 C 15,35 15,45 40,50 C 65,55 65,65 55,75" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 55,20 C 65,35 65,45 40,50 C 15,55 15,65 25,75" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <!-- Base pair rungs -->
    <line x1="26" y1="30" x2="54" y2="30" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" />
    <line x1="24" y1="42" x2="56" y2="42" stroke="#ffffff" stroke-width="2" />
    <line x1="24" y1="58" x2="56" y2="58" stroke="#ffffff" stroke-width="2" />
    <line x1="26" y1="70" x2="54" y2="70" stroke="#f43f5e" stroke-width="2" stroke-dasharray="2 2" />
    <circle cx="40" cy="50" r="4.5" fill="#34d399" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="105" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Suleiman<tspan fill="url(#textGrad)">Rosalind</tspan><tspan fill="#a855f7">Bioinformatics</tspan>
  </text>
  <text x="106" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2">
    284/284 SOLVED • ALGORITHMIC COMPUTATIONAL BIOLOGY
  </text>
</svg>
